name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      DASHBOARD_SKIP_TLS_PROBE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Unit tests (offline)
        run: python -m unittest discover tests -v
      - name: Console scripts
        run: |
          corrdash-update --help
          corrdash-etf --help
          corrdash-pairs --help
          corrdash-universe --help
          corrdash-app --help
